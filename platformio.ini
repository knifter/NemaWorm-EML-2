[platformio]
default_envs = debug

; Non-build settings shared by both environments
[env]
platform   = espressif32
board      = esp32-c3-devkitm-1
framework  = espidf
lib_deps   =
    https://github.com/ttlappalainen/NMEA2000
    https://github.com/ttlappalainen/NMEA0183
    https://github.com/knifter/NMEA2000_TWAI

; NMEA0183 ships only library.properties (Arduino-IDE manifest), so PIO's
; LDF flags it as framework-incompatible under espidf. Disable that filter.
lib_compat_mode = off
lib_ldf_mode = chain+

board_build.sdkconfig_defaults = sdkconfig.defaults

; ESP32-C3 USB-Serial-JTAG flashing: use USB-aware reset on both ends so the
; chip enters the bootloader cleanly and exits to the new firmware after flash.
; upload_protocol = esptool
; upload_flags    =
;     --before=usb_reset
;     --after=hard_reset

; Common build flags — referenced by both envs via interpolation
[flags]
common =
    -Os
    -DNMEA2000_DISABLED_DEBUG=1
    "-include$PROJECT_DIR/src/arduino_compat.h"

[env:debug]
monitor_speed = 115200
build_flags   =
    ${flags.common}
    -DDEBUG_BUILD

[env:release]
build_flags   =
    ${flags.common}
